name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API build & test (.NET Core 3.1)
    runs-on: ubuntu-latest
    # .NET Core 3.1 needs OpenSSL 1.1, which current Ubuntu runners no longer ship,
    # so build inside the official 3.1 SDK image instead of using setup-dotnet on the host.
    container: mcr.microsoft.com/dotnet/core/sdk:3.1
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - name: SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore FleetTracker.sln

      - name: Build
        run: dotnet build FleetTracker.sln -c Release --no-restore

      - name: Test
        run: dotnet test FleetTracker.sln -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  client:
    name: Client build (Angular 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 12

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build:prod

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [api, client]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fleet-tracker:ci .
